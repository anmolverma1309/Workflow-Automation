name: Daily Activity

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git author
        run: |
          git config user.name "Anmol Verma"
          git config user.email "aanmolverma1309@gmail.com"

      - name: Generate commits
        env:
          MIN_COMMITS: "4"
          MAX_COMMITS: "10"
        run: python scripts/daily_activity.py

      - name: Push
        run: git push
